<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1E1E2E" />
    <meta name="description" content="WordWiz - 跨平台单词学习 App" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WordWiz · 单词学习</title>
    
    <!-- 内联 SVG favicon，避免浏览器 404 请求 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />

    <!-- 样式 -->
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- Chart.js 用于统计图表（优先使用本地，如果加载失败使用 CDN 备选） -->
    <script src="js/lib/chart.umd.min.js"></script>
    <script>
        // Chart.js 本地加载失败时使用 CDN 备选
        if (typeof Chart === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <!-- ====== 导航栏 ====== -->
    <nav id="topNav">
        <div class="nav-inner">
            <div class="nav-brand">
                <span class="brand-icon">📖</span>
                <span class="brand-text">WordWiz</span>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="切换菜单">☰</button>
            <div class="nav-menu" id="navMenu">
                <button class="nav-btn active" data-page="home" title="主学习页">
                    <span class="nav-icon">📚</span>
                    <span class="nav-label">学习</span>
                </button>
                <button class="nav-btn" data-page="favorites" title="收藏夹">
                    <span class="nav-icon">⭐</span>
                    <span class="nav-label">收藏</span>
                </button>
                <button class="nav-btn" data-page="wrong-words" title="错题集">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">错题</span>
                </button>
                <button class="nav-btn" data-page="trash" title="回收站">
                    <span class="nav-icon">🗑️</span>
                    <span class="nav-label">回收站</span>
                </button>
                <button class="nav-btn" data-page="challenge" title="挑战模式">
                    <span class="nav-icon">🎯</span>
                    <span class="nav-label">挑战</span>
                </button>
                <button class="nav-btn" data-page="settings" title="设置">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">设置</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ====== 页面容器 ====== -->
    <main id="pageContainer">
        <!-- 各页面由 JS 动态渲染 -->
    </main>

    <!-- ====== Toast 通知 ====== -->
    <div id="toastContainer"></div>

    <!-- ====== JavaScript 模块（v=5 防浏览器缓存，改文件后同步递增） ====== -->
    <!-- 模型 -->
    <script src="js/models/word.js?v=6"></script>
    <!-- 数据库连接层 + DAO（按依赖顺序：基类 → 各DAO → 实例化） -->
    <script src="js/db/connection.js?v=8"></script>
    <script src="js/db/settings.dao.js?v=6"></script>
    <script src="js/db/stats.dao.js?v=6"></script>
    <script src="js/db/books.dao.js?v=6"></script>
    <script src="js/db/words.dao.js?v=8"></script>
    <script src="js/db/index.js?v=6"></script>
    <!-- 工具类 -->
    <script src="js/utils/parser.js?v=6"></script>
    <script src="js/utils/notifications.js?v=6"></script>
    <script src="js/utils/stats.js?v=6"></script>
    <script src="js/utils/achievements.js?v=1"></script>
    <script src="js/utils/sorter.js?v=1"></script>
    <!-- 页面组件 -->
    <script src="js/widgets/categoryFilter.js?v=5"></script>
    <script src="js/widgets/wordCard.js?v=5"></script>
    <script src="js/widgets/unitCard.js?v=5"></script>
    <!-- 页面 -->
    <script src="js/screens/home/shuffle.js?v=6"></script>
    <script src="js/screens/home.js?v=7"></script>
    <script src="js/screens/favorites.js?v=6"></script>
    <script src="js/screens/trash.js?v=5"></script>
    <script src="js/screens/settings.js?v=6"></script>
    <script src="js/screens/challenge.js?v=5"></script>
    <script src="js/screens/wrongwords.js?v=2"></script>
    <!-- 主入口 -->
    <script src="js/app.js?v=5"></script>
</body>
</html>
